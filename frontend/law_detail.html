<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法律详情</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#f5f5f5;color:#1a1a1a;line-height:1.8}
  .container{max-width:900px;margin:0 auto;padding:24px 20px}
  .header{background:#fff;border-radius:12px;padding:24px 28px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:12px;z-index:10}
  .header h1{font-size:20px;font-weight:600;flex:1;min-width:0;word-break:break-all}
  .btn-back,.btn-download{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:8px;font-size:14px;cursor:pointer;border:none;text-decoration:none;transition:background .15s}
  .btn-back{background:#e8e8e8;color:#333}
  .btn-back:hover{background:#d9d9d9}
  .btn-download{background:#1a73e8;color:#fff}
  .btn-download:hover{background:#1557b0}
  .content{background:#fff;border-radius:12px;padding:32px 36px;box-shadow:0 1px 4px rgba(0,0,0,.08);min-height:200px}
  .content .empty{text-align:center;color:#999;padding:60px 0}
  .loading{text-align:center;color:#999;padding:60px 0}
  .loading .spinner{display:inline-block;width:32px;height:32px;border:3px solid #e0e0e0;border-top-color:#1a73e8;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* 章标题 — 可点击跳转 */
  .law-detail-chapter{font-size:17px;font-weight:600;color:#1a1a1a;margin:24px 0 12px;padding-bottom:6px;border-bottom:1px solid #eee;cursor:pointer;transition:color .12s}
  .law-detail-chapter:hover{color:#1a73e8}
  .law-detail-chapter::before{content:"# ";color:#1a73e8;opacity:.5;font-size:14px}

  .law-detail-article{display:flex;gap:12px;margin:8px 0;padding:4px 0;align-items:flex-start}
  .art-num{white-space:nowrap;font-weight:600;color:#1a73e8;min-width:4em;font-size:15px}
  .art-text{font-size:15px;line-height:1.9;flex:1}
  .law-detail-paragraph{margin:6px 0;font-size:15px;text-indent:2em}
  .error{text-align:center;color:#c94135;padding:60px 0;font-size:15px}
  .error .detail{color:#999;font-size:13px;margin-top:8px}

  /* 目录 */
  .toc{background:#f8f9fa;border:1px solid #e8e8e8;border-radius:8px;padding:16px 20px;margin-bottom:24px}
  .toc-title{font-size:14px;font-weight:600;color:#666;margin-bottom:10px}
  .toc-list{list-style:none;padding:0}
  .toc-list li{margin:4px 0}
  .toc-list a{color:#1a73e8;text-decoration:none;font-size:14px;transition:color .12s}
  .toc-list a:hover{color:#0d47a1;text-decoration:underline}

  /* 回到顶部 */
  .back-to-top{position:fixed;bottom:32px;right:32px;width:44px;height:44px;border-radius:50%;background:#1a73e8;color:#fff;border:none;font-size:20px;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.2);display:none;align-items:center;justify-content:center;transition:all .2s;z-index:100}
  .back-to-top:hover{background:#1557b0;transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.25)}

  @media(max-width:600px){.container{padding:12px 10px}.header{padding:14px;flex-direction:column;align-items:stretch;top:6px;gap:8px}.content{padding:20px 14px}.header h1{font-size:17px}.back-to-top{bottom:16px;right:16px;width:40px;height:40px;font-size:18px}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <button onclick="closeWindow()" class="btn-back">&larr; 关闭</button>
    <h1 id="lawTitle">法律详情</h1>
    <button id="downloadBtn" class="btn-download" style="display:none">下载原文</button>
  </div>
  <div class="content" id="lawContent">
    <div class="loading">
      <div class="spinner"></div>
      <div>正在加载法律全文...</div>
    </div>
  </div>
</div>

<button class="back-to-top" id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="回到顶部">&#8593;</button>

<script>
(function(){
  const params=new URLSearchParams(location.search);
  const filename=params.get("filename");
  const category=params.get("category") || "";
  const title=params.get("title") || filename || "";

  const API_BASE="/api/v1";

  const titleEl=document.getElementById("lawTitle");
  const contentEl=document.getElementById("lawContent");
  const downloadBtn=document.getElementById("downloadBtn");
  const backToTopBtn=document.getElementById("backToTop");

  if(!filename){
    contentEl.innerHTML=`<div class="error">缺少文件参数<div class="detail">URL 中未提供 filename 参数</div></div>`;
    return;
  }

  titleEl.textContent=title;

  downloadBtn.style.display="inline-flex";
  downloadBtn.onclick=function(){ downloadLaw(filename); };

  // 滚动监听 — 显示/隐藏回到顶部按钮
  window.addEventListener("scroll",function(){
    backToTopBtn.style.display=window.scrollY>400 ? "flex" : "none";
  });

  fetch(API_BASE+"/files/"+encodeURIComponent(filename),{headers:{"Accept":"application/json"}})
    .then(r=>{
      if(!r.ok) throw new Error("HTTP "+r.status+" "+(r.statusText||""));
      return r.json();
    })
    .then(file=>{
      const text=file.content || "";
      if(!text){
        contentEl.innerHTML=`<div class="empty">暂无内容</div>`;
        return;
      }

      // 第一遍扫描：收集所有章标题，生成目录
      const lines=text.split("\n");
      const chapters=[];
      let chapterIdx=0;
      for(const line of lines){
        const trimmed=line.trim();
        if(!trimmed) continue;
        if(/^第[一二三四五六七八九十百千万0-9]+章/.test(trimmed)){
          chapters.push({id:"ch"+chapterIdx,text:trimmed});
          chapterIdx++;
        }
      }

      // 构建 HTML
      let html="";

      // 目录（如果有章节）
      if(chapters.length>0){
        html+=`<div class="toc"><div class="toc-title">目 录</div><ul class="toc-list">`;
        for(const ch of chapters){
          html+=`<li><a href="#${encodeURIComponent(ch.id)}">${escapeHtml(ch.text)}</a></li>`;
        }
        html+=`</ul></div>`;
      }

      // 正文
      chapterIdx=0;
      for(const line of lines){
        const trimmed=line.trim();
        if(!trimmed) continue;
        // 章标题
        if(/^第[一二三四五六七八九十百千万0-9]+章/.test(trimmed)){
          const id="ch"+chapterIdx;
          // 点击章标题跳转到本页面的该章位置（锚点自身）
          html+=`<div class="law-detail-chapter" id="${id}" onclick="location.href='#${id}'" title="点击复制链接">${escapeHtml(trimmed)}</div>`;
          chapterIdx++;
          continue;
        }
        // 条标题
        if(/^第[一二三四五六七八九十百千万0-9]+条/.test(trimmed)){
          const m=trimmed.match(/^(第[一二三四五六七八九十百千万0-9]+条)\s*(.*)/);
          if(m){
            html+=`<div class="law-detail-article"><span class="art-num">${escapeHtml(m[1])}</span><span class="art-text">${escapeHtml(m[2])}</span></div>`;
            continue;
          }
        }
        html+=`<div class="law-detail-paragraph">${escapeHtml(trimmed)}</div>`;
      }
      contentEl.innerHTML=html || `<div class="empty">暂无内容</div>`;
    })
    .catch(err=>{
      contentEl.innerHTML=`<div class="error">加载失败<div class="detail">${escapeHtml(err.message)}</div></div>`;
    });

  function escapeHtml(str){
    if(typeof str!=="string") return "";
    const div=document.createElement("div");
    div.textContent=str;
    return div.innerHTML;
  }

  function downloadLaw(fname){
    const url=API_BASE+"/files/"+encodeURIComponent(fname);
    const saveName=(title || fname).replace(/[\\/:*?"<>|]/g,"_")+".txt";
    fetch(url,{headers:{"Accept":"application/json"}})
      .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})
      .then(file=>{
        const text=file.content || "";
        const blob=new Blob([text],{type:"text/plain;charset=utf-8"});
        const a=document.createElement("a");
        a.href=URL.createObjectURL(blob);
        a.download=saveName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
      })
      .catch(err=>{alert("下载失败: "+err.message);});
  }
})();

function closeWindow(){
  // 新标签页打开的，没有历史记录，直接关闭
  window.close();
}
</script>
</body>
</html>
