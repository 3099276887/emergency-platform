<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>用户管理 - 应急安全综合平台</title>
<script src="auth.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Arial,"Microsoft YaHei",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#eef2f5;min-height:100vh;color:#233}
  header{background:#123b5d;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
  header h1{font-size:18px}
  header .who{font-size:13px;opacity:.9}
  header .who button{margin-left:10px;background:rgba(255,255,255,.15);border:0;color:#fff;padding:6px 12px;border-radius:4px;cursor:pointer}
  .wrap{max-width:1000px;margin:24px auto;padding:0 16px}
  .card{background:#fff;border:1px solid #d9e2e8;border-radius:8px;padding:20px 22px;margin-bottom:20px}
  .card h2{font-size:16px;color:#123b5d;margin-bottom:6px}
  .card .sub{font-size:13px;color:#6b7d89;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field label,.field label .lbl{font-size:13px;color:#536b78;margin-bottom:6px;display:block}
  .field input,.field select{width:100%;padding:9px 10px;border:1px solid #cbd7de;border-radius:4px;font:inherit;font-size:14px}
  .field input:focus,.field select:focus{outline:none;border-color:#2563eb}
  .field.full{grid-column:1 / -1}
  .role-tip{grid-column:1 / -1;background:#f0f6fc;border:1px solid #d3e4f2;border-radius:6px;padding:10px 12px;font-size:12px;color:#3a6079;line-height:1.8}
  .role-tip b{color:#123b5d}
  .actions{margin-top:16px;display:flex;align-items:center;gap:12px}
  button.primary{padding:10px 22px;border:0;border-radius:4px;background:#123b5d;color:#fff;cursor:pointer;font-size:14px}
  button.primary:hover{background:#1b4e79}
  button.primary:disabled{background:#9aaab3;cursor:not-allowed}
  .msg{font-size:13px}
  .msg.ok{color:#15803d}
  .msg.err{color:#b6372e}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #e6edf2}
  th{background:#f5f8fa;color:#536b78;font-weight:600}
  td .tag{display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px}
  .tag.user{background:#eef2f5;color:#536b78}
  .tag.sysadmin{background:#fef3c7;color:#92400e}
  .tag.secadmin{background:#dcfce7;color:#166534}
  .tag.audadmin{background:#fee2e2;color:#991b1b}
  td .st{font-size:12px;color:#6b7d89}
  td .st.on{color:#15803d}
  td .st.off{color:#b6372e}
  td button{padding:4px 10px;border:1px solid #cbd7de;border-radius:4px;background:#fff;color:#1f3a52;cursor:pointer;font-size:12px;margin-right:6px}
  td button:hover{border-color:#2563eb;color:#2563eb}
  td button.danger:hover{border-color:#dc2626;color:#dc2626}
  .empty{color:#9aaab3;font-size:13px;padding:16px 0}
  #selfRow button{display:none}
</style>
</head>
<body>
<header>
  <h1>应急安全综合平台 · 用户管理</h1>
  <div class="who"><span id="whoami"></span><button id="backBtn">返回业务台</button><button id="logoutBtn">退出登录</button></div>
</header>

<div class="wrap">
  <div class="card">
    <h2>创建用户</h2>
    <div class="sub">为平台成员开通账号。默认下发普通用户；三员账号请按安全管理规定分配。</div>
    <form id="createForm" autocomplete="off">
      <div class="grid">
        <div class="field">
          <label>登录账号 *</label>
          <input type="text" id="username" placeholder="2-64 位，字母/数字/下划线" maxlength="64">
        </div>
        <div class="field">
          <label>姓名</label>
          <input type="text" id="fullname" placeholder="真实姓名（选填）" maxlength="64">
        </div>
        <div class="field">
          <label>角色 *</label>
          <select id="role">
            <option value="user">普通用户（默认）</option>
            <option value="sysadmin">系统管理员</option>
            <option value="secadmin">安全保密员</option>
            <option value="audadmin">审计员</option>
          </select>
        </div>
        <div class="field">
          <label>初始密码 *</label>
          <input type="password" id="password" placeholder="至少 8 位" maxlength="128">
        </div>
        <div class="field">
          <label>确认密码 *</label>
          <input type="password" id="password2" placeholder="再次输入" maxlength="128">
        </div>
      </div>
      <div class="role-tip" id="roleTip"></div>
      <div class="actions">
        <button class="primary" id="createBtn" type="submit">创建用户</button>
        <span class="msg" id="createMsg"></span>
      </div>
    </form>
  </div>

  <div class="card">
    <h2>用户列表</h2>
    <div class="sub">仅系统管理员可在此创建、启用/停用、重置密码或调整角色。</div>
    <table id="userTable"></table>
    <div class="empty" id="emptyTip"></div>
  </div>
</div>

<script>
var ROLE_NAMES = { user:"普通用户", sysadmin:"系统管理员", secadmin:"安全保密员", audadmin:"审计员" };
var ROLE_TIPS = {
  user:"普通用户：可使用全部业务功能（文档、报告、知识库上传、AI 对话），但不能查看后台监控、用户管理、系统配置与审计日志。",
  sysadmin:"系统管理员：业务全功能 + 用户管理 + 系统配置 + 后台监控。不兼任安全保密与审计（不能看审计日志）。",
  secadmin:"安全保密员：专注数据保密与权限治理，可上传/删除知识库文件、查看后台监控；不负责用户管理与系统配置。",
  audadmin:"审计员：全局只读，负责查看审计日志与留痕监督，不执行业务写操作。"
};

var currentRole = null;
var createMsg = document.getElementById("createMsg");
var table = document.getElementById("userTable");
var emptyTip = document.getElementById("emptyTip");

function showMsg(id, text, ok){
  var el = document.getElementById(id);
  el.textContent = text;
  el.className = "msg " + (ok ? "ok" : "err");
  if(text){ if(ok) setTimeout(function(){ el.textContent=""; el.className="msg"; }, 3000); }
}

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function renderRoleTip(){
  var r = document.getElementById("role").value;
  document.getElementById("roleTip").innerHTML = "<b>" + ROLE_NAMES[r] + "：</b>" + ROLE_TIPS[r];
}
document.getElementById("role").addEventListener("change", renderRoleTip);
renderRoleTip();

async function ensureSelf(){
  try {
    var resp = await fetch("/api/v1/auth/me", { headers: { "Accept":"application/json" }});
    if(resp.status === 401) return null;
    if(!resp.ok) return null;
    var me = await resp.json();
    return me;
  } catch(e){ return null; }
}

function renderTable(users, me){
  if(!users || !users.length){
    table.innerHTML = "";
    emptyTip.textContent = "暂无用户。";
    return;
  }
  emptyTip.textContent = "";
  var selfId = me ? String(me.id) : "";
  var rows = users.map(function(u){
    var isSelf = String(u.id) === selfId;
    var st = u.is_active ? "已启用" : "已停用";
    var stCls = u.is_active ? "on" : "off";
    var btnStop = u.is_active ? '<button title="停用后该账号无法登录">停用</button>' : '<button class="danger" title="恢复登录能力">启用</button>';
    var ops = isSelf ? '<span class="st" style="margin-left:4px">当前账号不可操作</span>' :
      btnStop + '<button title="重置为初始强度密码">重置密码</button>' +
      '<button class="danger" title="直接修改角色">改角色</button>';
    return "<tr id='selfRow' data-id='"+u.id+"' data-username='" + esc(u.username) + "' data-role='"+esc(u.role)+"' data-active='"+u.is_active+"'>" +
      "<td>" + esc(u.username) + "<div class='st'>" + (u.full_name ? esc(u.full_name) : "—") + "</div></td>" +
      "<td><span class='tag " + esc(u.role) + "'>" + esc(ROLE_NAMES[u.role] || u.role) + "</span></td>" +
      "<td><span class='st " + stCls + "'>" + st + "</span></td>" +
      "<td>" + ops + "</td></tr>";
  }).join("");
  table.innerHTML = "<thead><tr><th>账号 / 姓名</th><th>角色</th><th>状态</th><th>操作</th></tr></thead><tbody>" + rows + "</tbody>";
}

async function loadUsers(){
  var me = await ensureSelf();
  if(!me){
    window.location.href = "login.html";
    return null;
  }
  if(me.role !== "sysadmin"){
    window.location.href = "index.html";
    return null;
  }
  currentRole = me.role;
  document.getElementById("whoami").textContent = "系统管理员：" + me.username;
  var resp = await fetch("/api/v1/users", { headers: { "Accept":"application/json" }});
  if(resp.status === 403){ window.location.href = "index.html"; return null; }
  if(!resp.ok){ renderTable([], null); return null; }
  var list = await resp.json();
  renderTable(list, me);
  return me;
}

document.getElementById("createForm").addEventListener("submit", async function(ev){
  ev.preventDefault();
  var username = document.getElementById("username").value.trim();
  var fullname = document.getElementById("fullname").value.trim();
  var role = document.getElementById("role").value;
  var password = document.getElementById("password").value;
  var password2 = document.getElementById("password2").value;

  if(!username){ showMsg("createMsg","请输入登录账号",false); return; }
  if(!/^[A-Za-z0-9_]{2,64}$/.test(username)){ showMsg("createMsg","账号需为 2-64 位字母/数字/下划线",false); return; }
  if(password.length < 8){ showMsg("createMsg","密码至少 8 位",false); return; }
  if(password !== password2){ showMsg("createMsg","两次密码不一致",false); return; }

  var btn = document.getElementById("createBtn");
  btn.disabled = true;
  try {
    var resp = await fetch("/api/v1/users", {
      method: "POST",
      headers: { "Content-Type":"application/json", "Accept":"application/json" },
      body: JSON.stringify({ username: username, full_name: fullname, role: role, password: password })
    });
    var body = null;
    var text = await resp.text();
    if(text){ try{ body = JSON.parse(text); }catch(e){} }
    if(!resp.ok){
      var detail = (body && body.detail) ? body.detail : ("HTTP " + resp.status);
      showMsg("createMsg", "创建失败：" + detail, false);
      return;
    }
    showMsg("createMsg", "已创建账号 " + body.username + "（" + ROLE_NAMES[body.role] + "）", true);
    document.getElementById("username").value = "";
    document.getElementById("fullname").value = "";
    document.getElementById("password").value = "";
    document.getElementById("password2").value = "";
    await loadUsers();
  } catch(e){
    showMsg("createMsg", "无法连接后端，请检查网关", false);
  } finally {
    btn.disabled = false;
  }
});

table.addEventListener("click", async function(ev){
  var btn = ev.target.closest("button");
  if(!btn) return;
  var tr = btn.closest("tr");
  var id = tr.getAttribute("data-id");
  var uname = tr.getAttribute("data-username");
  var active = tr.getAttribute("data-active") === "true";
  var role = tr.getAttribute("data-role");
  var txt = btn.textContent;

  if(txt === "停用" || txt === "启用"){
    if(!confirm("确认" + (txt === "停用" ? "停用" : "启用") + "账号 " + uname + " ？")) return;
    try {
      var resp = await fetch("/api/v1/users/" + id, {
        method: "PATCH",
        headers: { "Content-Type":"application/json", "Accept":"application/json" },
        body: JSON.stringify({ is_active: txt === "启用" ? true : false })
      });
      if(resp.ok) loadUsers(); else alert("操作失败：" + (await resp.text()));
    } catch(e){ alert("无法连接后端"); }
  }
  else if(txt === "重置密码"){
    var np = prompt("为 " + uname + " 设置新密码（至少 8 位）：","");
    if(np === null) return;
    if(np.length < 8){ alert("密码至少 8 位"); return; }
    try {
      var resp = await fetch("/api/v1/users/" + id + "/reset-password", {
        method: "POST",
        headers: { "Content-Type":"application/json", "Accept":"application/json" },
        body: JSON.stringify({ new_password: np })
      });
      if(resp.ok) alert("密码已重置"); else alert("操作失败：" + (await resp.text()));
    } catch(e){ alert("无法连接后端"); }
  }
  else if(txt === "改角色"){
    var nr = prompt("为 " + uname + " 设置新角色（user/sysadmin/secadmin/audadmin）：", role);
    if(nr === null) return;
    nr = nr.replace(/\s/g,"");
    if(!["user","sysadmin","secadmin","audadmin"].includes(nr)){ alert("无效角色"); return; }
    try {
      var resp = await fetch("/api/v1/users/" + id, {
        method: "PATCH",
        headers: { "Content-Type":"application/json", "Accept":"application/json" },
        body: JSON.stringify({ role: nr })
      });
      if(resp.ok) loadUsers(); else alert("操作失败：" + (await resp.text()));
    } catch(e){ alert("无法连接后端"); }
  }
});

document.getElementById("backBtn").onclick = function(){ window.location.href = "index.html"; };
document.getElementById("logoutBtn").onclick = function(){ window.logoutAuth(); window.location.href = "login.html"; };

loadUsers();
</script>
</body>
</html>
