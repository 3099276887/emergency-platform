<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>系统管理员台 - 应急安全综合平台</title>
<script src="auth.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Arial,"Microsoft YaHei",sans-serif;background:#eef2f5;color:#233;min-height:100vh}
  header{background:#123b5d;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
  header h1{font-size:18px}
  header .ops button{margin-left:10px;background:rgba(255,255,255,.15);border:0;color:#fff;padding:6px 12px;border-radius:4px;cursor:pointer}
  header .ops button:hover{background:rgba(255,255,255,.3)}
  .wrap{max-width:1000px;margin:24px auto;padding:0 16px}
  .panel{background:#fff;border:1px solid #d9e2e8;border-radius:8px;padding:18px 20px;margin-bottom:18px}
  .panel h2{font-size:16px;color:#123b5d;margin-bottom:4px}
  .panel .sub{font-size:13px;color:#6b7d89;margin-bottom:14px}
  .btn{padding:9px 18px;border:0;border-radius:4px;background:#123b5d;color:#fff;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block;margin-right:10px}
  .btn:hover{background:#1b4e79}
  .btn.gray{background:#e5ebf0;color:#1f3a52}
  .btn.gray:hover{background:#d5dfe7}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field label{font-size:13px;color:#536b78;margin-bottom:6px;display:block}
  .field input,.field select{width:100%;padding:9px 10px;border:1px solid #cbd7de;border-radius:4px;font:inherit;font-size:14px}
  .field input:focus,.field select:focus{outline:none;border-color:#2563eb}
  .pwd-wrap{position:relative}
  .pwd-wrap input{padding-right:38px}
  .pwd-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;padding:6px;color:#8b9aa3;line-height:0;display:flex;align-items:center}
  .pwd-toggle:hover{color:#2563eb}
  .field.full{grid-column:1 / -1}
  .msg{font-size:13px}
  .msg.ok{color:#15803d}
  .msg.err{color:#b6372e}
  .tip{font-size:13px;color:#3a6079;background:#f0f6fc;border:1px solid #d3e4f2;padding:10px 12px;border-radius:6px;line-height:1.7}
</style>
</head>
<body>
<header>
  <h1>应急安全综合平台 · 系统管理员台</h1>
  <div class="ops"><span id="whoami"></span><button onclick="window.open('admin.html','_blank')">后台监控</button><button onclick="window.location.href='index.html'">进入业务台</button><button onclick="window.logoutAuth();location.href='login.html'">退出登录</button></div>
</header>
<div class="wrap">
  <div class="panel">
    <h2>后台管理</h2>
    <div class="sub">进入后台管理界面，进行系统监控、审计等管理操作。</div>
    <a class="btn" href="admin.html" target="_blank" rel="noopener">前往后台管理 →</a>
  </div>
  <div class="panel">
    <h2>创建账号</h2>
    <div class="sub">为平台成员开通账号。默认下发普通用户；三员账号请按安全管理规定分配。</div>
    <form id="createForm" autocomplete="off">
      <div class="grid">
        <div class="field">
          <label>登录账号 *</label>
          <input type="text" id="username" placeholder="2-64 位，字母/数字/下划线" maxlength="64">
        </div>
        <div class="field">
          <label>姓名</label>
          <input type="text" id="fullname" placeholder="真实姓名（选填）" maxlength="64">
        </div>
        <div class="field">
          <label>角色 *</label>
          <select id="role">
            <option value="user">普通用户（默认）</option>
            <option value="sysadmin">系统管理员</option>
            <option value="secadmin">安全保密员</option>
            <option value="audadmin">审计员</option>
          </select>
        </div>
        <div class="field">
          <label>初始密码 *</label>
          <div class="pwd-wrap">
            <input type="password" id="password" placeholder="至少 8 位" maxlength="128">
            <button type="button" class="pwd-toggle" title="显示/隐藏密码"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
          </div>
        </div>
        <div class="field">
          <label>确认密码 *</label>
          <div class="pwd-wrap">
            <input type="password" id="password2" placeholder="再次输入" maxlength="128">
            <button type="button" class="pwd-toggle" title="显示/隐藏密码"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
          </div>
        </div>
      </div>
      <div style="margin-top:12px">
        <button class="btn" id="createBtn" type="submit">创建用户</button>
        <span class="msg" id="createMsg"></span>
      </div>
    </form>
  </div>
  <div class="panel">
    <h2>用户管理</h2>
    <div class="sub">查看全部用户、启用/停用、重置密码或调整角色。</div>
    <a class="btn" href="users.html" target="_blank" rel="noopener">前往完整用户管理 →</a>
  </div>
</div>
<script>
var ROLE_NAMES = { user:"普通用户", sysadmin:"系统管理员", secadmin:"安全保密员", audadmin:"审计员" };
var who = document.getElementById("whoami");
var createMsg = document.getElementById("createMsg");

function showMsg(el, text, ok){
  el.textContent = text;
  el.className = "msg " + (ok ? "ok" : "err");
  if(text && ok) setTimeout(function(){ el.textContent=""; el.className="msg"; }, 3000);
}

async function me(){
  var r = await fetch("/api/v1/auth/me", { headers: { "Accept":"application/json" }});
  if(r.status === 401 || !r.ok) return null;
  return r.json();
}

document.getElementById("createForm").addEventListener("submit", async function(ev){
  ev.preventDefault();
  var username = document.getElementById("username").value.trim();
  var fullname = document.getElementById("fullname").value.trim();
  var role = document.getElementById("role").value;
  var password = document.getElementById("password").value;
  var password2 = document.getElementById("password2").value;

  if(!username){ showMsg(createMsg, "请输入登录账号", false); return; }
  if(!/^[A-Za-z0-9_]{2,64}$/.test(username)){ showMsg(createMsg, "账号需为 2-64 位字母/数字/下划线", false); return; }
  if(password.length < 8){ showMsg(createMsg, "密码至少 8 位", false); return; }
  if(password !== password2){ showMsg(createMsg, "两次密码不一致", false); return; }

  var btn = document.getElementById("createBtn");
  btn.disabled = true;
  try {
    var resp = await fetch("/api/v1/users", {
      method: "POST",
      headers: { "Content-Type":"application/json", "Accept":"application/json" },
      body: JSON.stringify({ username: username, full_name: fullname, role: role, password: password })
    });
    var body = null;
    var text = await resp.text();
    if(text){ try{ body = JSON.parse(text); }catch(e){} }
    if(!resp.ok){
      var detail = (body && body.detail) ? body.detail : ("HTTP " + resp.status);
      showMsg(createMsg, "创建失败：" + detail, false);
      return;
    }
    showMsg(createMsg, "已创建账号 " + body.username + "（" + ROLE_NAMES[body.role] + "）", true);
    document.getElementById("username").value = "";
    document.getElementById("fullname").value = "";
    document.getElementById("password").value = "";
    document.getElementById("password2").value = "";
  } catch(e){
    showMsg(createMsg, "无法连接后端，请检查网关", false);
  } finally {
    btn.disabled = false;
  }
});

me().then(function(d){
  if(!d){ location.href = "login.html"; return; }
  if(d.role !== "sysadmin"){ alert("权限不足：您的账号不是系统管理员，无法访问该页面"); location.href = "index.html"; return; }
  who.textContent = "系统管理员：" + d.username;
});

// 密码显隐切换
var PWD_OPEN = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
var PWD_CLOSED = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="2" x2="22" y2="22"></line><path d="M10.6 3.5A11.2 11.2 0 0 1 12 3c7 0 11 7 11 7a18 18 0 0 1-3.4 4.2M6.6 6.6A18 18 0 0 0 1 12s4 7 11 7a11 11 0 0 0 3.4-.6"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>';
(function(){
  document.querySelectorAll(".pwd-toggle").forEach(function(btn){
    btn.addEventListener("click", function(){
      var input = btn.parentNode.querySelector("input[type=password], input[type=text]");
      var show = input.type === "password";
      input.type = show ? "text" : "password";
      btn.innerHTML = show ? PWD_CLOSED : PWD_OPEN;
    });
  });
})();
</script>
</body>
</html>
