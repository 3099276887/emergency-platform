<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 - 应急安全综合平台</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Arial,"Microsoft YaHei",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#eef2f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{width:380px;max-width:100%;background:#fff;border:1px solid #d9e2e8;border-radius:8px;padding:34px 32px;box-shadow:0 8px 24px rgba(18,59,93,.08)}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .brand .logo{width:36px;height:36px;border-radius:8px;background:#123b5d;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex-shrink:0}
  h1{font-size:20px;color:#123b5d;line-height:1.3}
  .sub{color:#6b7d89;font-size:13px;margin:4px 0 24px}
  label{display:block;font-size:13px;color:#536b78;margin:16px 0 6px}
  input{width:100%;padding:11px 12px;border:1px solid #cbd7de;border-radius:4px;font:inherit;font-size:14px}
  input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 1px #2563eb}
  button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:4px;background:#123b5d;color:#fff;font-size:15px;cursor:pointer}
  button:hover{background:#1b4e79}
  button:disabled{background:#9aaab3;cursor:not-allowed}
  .error{display:none;margin-top:16px;padding:10px 12px;background:#fef2f2;border:1px solid #fecaca;border-radius:4px;color:#b6372e;font-size:13px}
  .error.show{display:block}
  .hint{margin-top:20px;padding-top:14px;border-top:1px solid #eef2f5;color:#9aaab3;font-size:12px;line-height:1.9}
  .hint b{color:#123b5d;font-weight:600}
  .loading-span{margin-left:6px}
</style>
</head>
<body>

<div class="login-card">
  <div class="brand">
    <div class="logo">安</div>
    <h1>应急安全综合平台</h1>
  </div>
  <div class="sub">请输入账号密码登录（三权分立账号）</div>

  <label>账号</label>
  <input type="text" id="username" autocomplete="username" placeholder="请输入账号" autofocus>

  <label>密码</label>
  <input type="password" id="password" autocomplete="current-password" placeholder="请输入密码">

  <button id="loginBtn" type="button">登 录</button>

  <div class="error" id="errorMsg"></div>

  <div class="hint">
    内置账号（登录后请尽快修改初始密码）：<br>
    <b>sysadmin</b> 系统管理员 &nbsp;|&nbsp; <b>secadmin</b> 安全管理员 &nbsp;|&nbsp; <b>audadmin</b> 审计管理员
  </div>
</div>

<script>
var API_BASE = "/api/v1";
var errorMsg = document.getElementById("errorMsg");
var loginBtn = document.getElementById("loginBtn");
var usernameEl = document.getElementById("username");
var passwordEl = document.getElementById("password");

function showError(msg){
  errorMsg.textContent = msg;
  errorMsg.classList.add("show");
}

function getRedirect(){
  var m = /(?:^|[?&])redirect=([^&]+)/.exec(location.search);
  if(m){
    try { return decodeURIComponent(m[1]); }catch(e){ return "/"; }
  }
  return "/";
}

async function doLogin(){
  var username = usernameEl.value.trim();
  var password = passwordEl.value;
  if(!username){ showError("请输入账号"); usernameEl.focus(); return; }
  if(!password){ showError("请输入密码"); passwordEl.focus(); return; }

  loginBtn.disabled = true;
  loginBtn.textContent = "登录中...";
  errorMsg.classList.remove("show");

  try{
    var resp = await fetch(API_BASE + "/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: username, password: password })
    });

    var body = null;
    var text = await resp.text();
    if(text){ try{ body = JSON.parse(text); }catch(e){ body = null; } }

    if(!resp.ok){
      var detail = (body && body.detail) ? body.detail : ("HTTP " + resp.status);
      showError("登录失败：" + detail);
      return;
    }
    if(!body || !body.access_token){ showError("登录失败：响应缺少访问令牌"); return; }

    // 登录页不加载 auth.js，这里直接写入；key 必须与 auth.js 中的常量一致
    try { localStorage.setItem("sferag_jwt_token", body.access_token); } catch(e){}

    var redir = getRedirect() || "/";
    // 若已带 token，避免把 login.html 作为跳转目标
    if(redir.indexOf("login.html") >= 0) redir = "/";
    location.replace(redir);
  }catch(e){
    showError("无法连接后端：请确认网关可达，或联系管理员");
  }finally{
    loginBtn.disabled = false;
    loginBtn.textContent = "登 录";
  }
}

loginBtn.onclick = doLogin;
passwordEl.addEventListener("keydown", function(e){ if(e.key === "Enter") doLogin(); });
usernameEl.addEventListener("keydown", function(e){ if(e.key === "Enter") passwordEl.focus(); });
</script>

</body>
</html>
