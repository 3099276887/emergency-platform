<div class="layout">

<script>
const modules={
home:{name:"综合首页",icon:"⌂",desc:"查看平台模块与本机运行信息"},
law:{name:"安全法律",icon:"法",desc:"查看安全生产、应急管理和消防相关法律法规"},
data:{name:"数据中心",icon:"数",desc:"查看文档处理任务及生成结果"},
documents:{name:"文档处理",icon:"文",desc:"粘贴文档并生成处理报告"},
ai:{name:"AI 对话",icon:"AI",desc:"与本地千问模型进行对话"}
};

const API_BASE="/api/v1";

let documentPollTimer=null;
let currentDocumentId=null;
const nav=document.getElementById("nav");
const app=document.getElementById("app");
const CHAT_STORAGE_KEY = "emergency_ai_chat_v1";
let current=location.hash.slice(1)||"home";
let lawCategory="national";
let documentState = {
  originalText: "",
  requirements: "",
  outputFilename: "处理结果.md",
  status: "",
  statusClass: "note",
  result: "",
  explanation: "",
  downloadUrl: "",
  processing: false,
  docId: null
};
let aiAbortController = null;
let chatMessages = [
  {
    role: "system",
    content: "请严谨回答，不得虚构事实。只能依据用户提供的信息回答；无法确认时明确说明。"
  }
];

function saveChat(){
  localStorage.setItem(
    CHAT_STORAGE_KEY,
    JSON.stringify(chatMessages)
  );
}

function loadChat(){
  try{
    const saved=JSON.parse(
      localStorage.getItem(CHAT_STORAGE_KEY)
    );

    if(Array.isArray(saved) && saved.length>0){
      chatMessages=saved;
    }
  }catch(error){
    console.warn("读取历史对话失败",error);
  }
}

function getChatHistory(){
  return chatMessages
    .filter(message=>message.role!=="system")
    .map(message=>{
      const name=message.role==="user"?"用户":"AI";
      return name+"："+message.content;
    })
    .join("\n\n");
}

function getRequestMessages(){
  const systemMessage=chatMessages.find(
    message=>message.role==="system"
  );

  const history=chatMessages
    .filter(message=>message.role!=="system")
    .slice(-20);

  return [systemMessage,...history];
}

    const mainButton=`
      <button class="${key===current?"active":""}" data-key="${key}">
        ${item.icon}　${item.name}
      </button>
    `;

    if(key==="law"){
      return mainButton+`
        <div class="law-subnav">
          <button class="${current==="law" && lawCategory==="national"?"law-subnav-active":""}" data-law-category="national">国家法律</button>
          <button class="${current==="law" && lawCategory==="regulations"?"law-subnav-active":""}" data-law-category="regulations">规章制度</button>
          <button class="${current==="law" && lawCategory==="emergency"?"law-subnav-active":""}" data-law-category="emergency">应急管理部规章</button>
          <button class="${current==="law" && lawCategory==="ministries"?"law-subnav-active":""}" data-law-category="ministries">其他部委规章</button>
          <button class="${current==="law" && lawCategory==="local"?"law-subnav-active":""}" data-law-category="local">地方文件</button>
          <button class="${current==="law" && lawCategory==="policy"?"law-subnav-active":""}" data-law-category="policy">政策解读</button>

  nav.querySelectorAll("button[data-key]").forEach(button=>{

    showLawCategory(lawCategory);

});
}

async function loadTaskTypes(){
  const select=document.getElementById("taskType");
  const description=document.getElementById("taskDescription");

  try{
    const response=await fetch(API_BASE+"/tasks");
    const result=await response.json();

    if(!response.ok){
      throw new Error(result.message || "任务类型加载失败");
    }

    const tasks=Array.isArray(result.tasks) ? result.tasks : [];

    if(tasks.length===0){
      select.innerHTML='<option value="">暂无任务类型</option>';
      return;
    }

    select.innerHTML=tasks.map(task=>`
      <option value="${escapeHtml(task.key)}">
        ${escapeHtml(task.name)}
      </option>
    `).join("");

    function updateDescription(){
      const selected=tasks.find(task=>task.key===select.value);
      description.textContent=selected ? selected.description || "" : "";
    }

    select.onchange=updateDescription;
    updateDescription();
  }catch(error){
    select.innerHTML='<option value="">加载失败</option>';
    description.textContent=error.message;
  }
}

function escapeHtml(value){
  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function saveDocumentForm(){

  const fileName = document.getElementById("fileName");

    documentState.requirements = instruction.value;
  }

  if(fileName){
    documentState.outputFilename = fileName.value;
  }
}

async function sendAiMessage(){
  aiAbortController = new AbortController();
  const stopButton = document.getElementById("aiStop");
  stopButton.disabled = false;
  const input=document.getElementById("aiInput");
  const log=document.getElementById("chatLog");
  const status=document.getElementById("aiStatus");
  const button=document.getElementById("aiSend");
  const content=input.value.trim();

  if(!content){
    status.textContent="请输入问题";
    status.className="note error";
    return;
  }

  button.disabled=true;
  button.textContent="处理中...";
  status.textContent="正在处理...";
  status.className="note";

  chatMessages.push({
    role:"user",
    content:content
  });

  saveChat();

  log.textContent=getChatHistory()+"\n\nAI：";
  log.scrollTop=log.scrollHeight;

  let fullAnswer="";
  let buffer="";

  try{
    const response=await fetch(
      "/v1/chat/completions",
      {
        method:"POST",
        headers:{
          "Accept":"text/event-stream",
          "Content-Type":"application/json"
        },
        signal: aiAbortController.signal,
        body:JSON.stringify({
          model:"tpu-qwen3.5",
          messages:getRequestMessages(),
          stream:true,
          temperature:0.7,
          max_tokens:2048
        })
      }
    );

    if(!response.ok){
      const errorText=await response.text();
      throw new Error(
        errorText || "AI 接口请求失败"
      );
    }

    if(!response.body){
      throw new Error(
        "浏览器不支持流式响应"
      );
    }

    const reader=response.body.getReader();
    const decoder=new TextDecoder("utf-8");

    function handleLine(rawLine){
      const line=rawLine.trim();

      if(!line || !line.startsWith("data:")){
        return;
      }

      const data=line.slice(5).trim();

      if(!data || data==="[DONE]"){
        return;
      }

      try{
        const chunk=JSON.parse(data);
        const text=
          chunk.choices &&
          chunk.choices[0] &&
          chunk.choices[0].delta &&
          chunk.choices[0].delta.content;

        if(text){
          fullAnswer+=text;
          log.textContent+=text;
          log.scrollTop=log.scrollHeight;
        }
      }catch(error){
        console.warn(
          "忽略无法解析的数据块：",
          data
        );
      }
    }

    while(true){
      const {value,done}=await reader.read();

      if(done){
        break;
      }

      buffer+=decoder.decode(
        value,
        {stream:true}
      );

      const lines=buffer.split(/\r?\n/);
      buffer=lines.pop() || "";

      for(const line of lines){
        handleLine(line);
      }
    }

    if(buffer.trim()){
      handleLine(buffer);
    }

    chatMessages.push({
      role:"assistant",
      content:fullAnswer
    });

    saveChat();

    input.value="";
    status.textContent="处理完成";
    status.className="note success";

  }catch(error){
    if(error.name === "AbortError"){
    status.textContent = "已停止生成";
    status.className = "note";
    }else{
    status.textContent = "请求失败：" + error.message;
    status.className = "note error";
    }
  }finally{
    button.disabled=false;
    button.textContent="发送";
    stopButton.disabled = true;
    aiAbortController = null;
  }
}

async function processDocument(){
  const taskType=document.getElementById("taskType").value;
  const originalText=document.getElementById("documentContent").value.trim();
  const requirements=document.getElementById("instruction").value.trim();
  const outputFilename=document.getElementById("fileName").value.trim();

  const button=document.getElementById("processBtn");
  const status=document.getElementById("documentStatus");
  const resultBox=document.getElementById("resultContent");
  const downloadLink=document.getElementById("downloadLink");

  if(!taskType || !originalText || !requirements || !outputFilename){
    status.textContent="请完整填写任务类型、原始文档、处理要求和文件名";
    status.className="note error";
    return;
  }

  button.disabled=true;
  button.textContent="正在提交...";
  status.textContent="正在提交任务";
  status.className="note";
  resultBox.textContent="任务提交中...";
  downloadLink.hidden=true;

  try{
    const response=await fetch(API_BASE+"/documents/process",{
      method:"POST",
      headers:{
        "Accept":"application/json",
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        task_type:taskType,
        original_text:originalText,
        requirements:requirements,
        output_filename:outputFilename
      })
    });

    const result=await response.json();

    if(!response.ok){
      throw new Error(getErrorMessage(result));
    }

    if(!result.id){
      throw new Error("后端没有返回任务 ID");
    }

    currentDocumentId=result.id;
    status.textContent=result.message || "任务已提交";
    resultBox.textContent="AI 正在处理，请等待...";

    startDocumentPolling(result.id);
    loadDocuments();
  }catch(error){
    status.textContent=error.message;
    status.className="note error";
    resultBox.textContent="提交失败";
    button.disabled=false;
    button.textContent="开始处理";
  }
}

function startDocumentPolling(id){
  if(documentPollTimer){
    clearInterval(documentPollTimer);
  }

  checkDocumentStatus(id);

  documentPollTimer=setInterval(()=>{
    checkDocumentStatus(id);
  },3000);
}

async function checkDocumentStatus(id){
  const status=document.getElementById("documentStatus");
  const resultBox=document.getElementById("resultContent");
  const button=document.getElementById("processBtn");
  const downloadLink=document.getElementById("downloadLink");

  try{
    const response=await fetch(
      API_BASE+"/documents/"+encodeURIComponent(id)
    );

    const result=await response.json();

    if(!response.ok){
      throw new Error(getErrorMessage(result));
    }

    if(result.status==="completed"){
      clearInterval(documentPollTimer);
      documentPollTimer=null;

      status.textContent="处理完成";
      status.className="note success";
      resultBox.textContent=result.report_content || "后端未返回报告内容";

      downloadLink.href=
        API_BASE+"/documents/"+encodeURIComponent(id)+"/download";
      downloadLink.download=result.output_filename || "分析报告";
      downloadLink.hidden=false;

      button.disabled=false;
      button.textContent="开始处理";
      loadDocuments();
      return;
    }

    if(result.status==="failed"){
      clearInterval(documentPollTimer);
      documentPollTimer=null;

      status.textContent="处理失败";
      status.className="note error";
      resultBox.textContent=result.report_content || "后端未返回失败原因";

      button.disabled=false;
      button.textContent="重新提交";
      loadDocuments();
      return;
    }

    status.textContent=result.status==="pending"
      ? "任务排队中"
      : "AI 正在处理";
  }catch(error){
    clearInterval(documentPollTimer);
    documentPollTimer=null;

    status.textContent="查询失败："+error.message;
    status.className="note error";
    button.disabled=false;
    button.textContent="重新提交";
  }
}

async function loadDocuments(){
  const list=document.getElementById("documentList");

  try{
    const response=await fetch(
      API_BASE+"/documents?page=1&page_size=20"
    );

    const result=await response.json();

    if(!response.ok){
      throw new Error(getErrorMessage(result));
    }

    const items=Array.isArray(result.items) ? result.items : [];

    if(items.length===0){
      list.innerHTML='<p class="desc">暂无真实任务记录</p>';
      return;
    }

    list.innerHTML=items.map(item=>`
      <div class="history-item">
        <strong>${escapeHtml(item.output_filename||"未命名文档")}</strong>
        <span>${escapeHtml(item.task_type||"")}</span>
        <span>${escapeHtml(item.status||"")}</span>
        <span>${escapeHtml(formatTime(item.created_at))}</span>
        <button data-document-id="${escapeHtml(item.id)}">查看</button>
      </div>
    `).join("");

    list.querySelectorAll("[data-document-id]").forEach(button=>{
      button.onclick=()=>{
        currentDocumentId=button.dataset.documentId;
        startDocumentPolling(currentDocumentId);
      };
    });
  }catch(error){
    list.textContent="历史任务加载失败："+error.message;
  }
}

async function loadDataCenterTasks(){
  const list=document.getElementById("dataTaskList");
  const status=document.getElementById("dataStatus");

  if(!list || !status){
    return;
  }

  status.textContent="正在加载任务...";
  status.className="note";

  try{
    const response=await fetch(
      API_BASE+"/documents?page=1&page_size=50",
      {
        method:"GET",
        headers:{
          "Accept":"application/json"
        },
        cache:"no-store"
      }
    );

    const result=await response.json();

    if(!response.ok){
      throw new Error(getErrorMessage(result));
    }

    const items=Array.isArray(result.items) ? result.items : [];

    if(items.length===0){
      list.innerHTML=`
        <div class="empty">
          <strong>暂无真实任务</strong>
          <span>完成文档处理后，任务会显示在这里。</span>
        </div>
      `;
      status.textContent="";
      return;
    }

    list.innerHTML=items.map(item=>{
      const stateName={
        pending:"排队中",
        processing:"处理中",
        completed:"已完成",
        failed:"失败"
      }[item.status] || item.status || "未知";

      const detailUrl=
        API_BASE+"/documents/"+encodeURIComponent(item.id);

      const downloadUrl=
        API_BASE+"/documents/"+
        encodeURIComponent(item.id)+"/download";

      return `
        <div class="data-task">
          <div class="data-task-main">
            <strong>${escapeHtml(
              item.output_filename || "未命名任务"
            )}</strong>
            <span>任务类型：${escapeHtml(
              item.task_type || "未指定"
            )}</span>
            <span>创建时间：${escapeHtml(
              formatTime(item.created_at)
            )}</span>
            <span>完成时间：${escapeHtml(
              formatTime(item.completed_at) || "未完成"
            )}</span>
          </div>

          <div class="data-task-actions">
            <b class="task-status status-${escapeHtml(item.status || "")}">
              ${escapeHtml(stateName)}
            </b>
            <button
              class="btn-secondary"
              data-detail-url="${escapeHtml(detailUrl)}"
            >
              查看
            </button>
            ${
              item.status==="completed"
                ? `<a class="download"
                    href="${escapeHtml(downloadUrl)}"
                    download>
                    下载
                   </a>`
                : ""
            }
          </div>
        </div>
      `;
    }).join("");

    list.querySelectorAll("[data-detail-url]").forEach(button=>{
      button.onclick=async()=>{
        try{
          const response=await fetch(button.dataset.detailUrl,{
            headers:{"Accept":"application/json"}
          });

          const detail=await response.json();

          if(!response.ok){
            throw new Error(getErrorMessage(detail));
          }

          showDataTaskDetail(detail);
        }catch(error){
          status.textContent="读取任务失败："+error.message;
          status.className="note error";
        }
      };
    });

    status.textContent=`共 ${result.total ?? items.length} 条任务`;
    status.className="note success";
  }catch(error){
    list.innerHTML="";
    status.textContent="历史任务加载失败："+error.message;
    status.className="note error";
  }
}

function showDataTaskDetail(detail){
  const old=document.getElementById("dataTaskDetail");

  if(old){
    old.remove();
  }

  const panel=document.createElement("section");
  panel.id="dataTaskDetail";
  panel.className="panel";

  panel.innerHTML=`
    <div class="panel-title-row">
      <h2>任务详情</h2>
      <button class="btn-secondary" id="closeDataDetail">
        关闭
      </button>
    </div>

    <p><strong>文件名：</strong>${escapeHtml(
      detail.output_filename || ""
    )}</p>

    <p><strong>任务类型：</strong>${escapeHtml(
      detail.task_type || ""
    )}</p>

    <p><strong>状态：</strong>${escapeHtml(
      detail.status || ""
    )}</p>

    <pre class="result">${escapeHtml(
      detail.report_content || "暂无生成报告"
    )}</pre>
  `;

  document.getElementById("page-data").appendChild(panel);

  document.getElementById("closeDataDetail").onclick=()=>{
    panel.remove();
  };
}

function getErrorMessage(result){
  if(Array.isArray(result.detail)){
    return result.detail.map(item=>item.msg).join("；");
  }

  return result.message || result.detail || "接口请求失败";
}

function escapeHtml(value){
  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function formatTime(value){
  if(!value){
    return "";
  }

  const date=new Date(value);

  return Number.isNaN(date.getTime())
    ? value
    : date.toLocaleString("zh-CN");
}

function showPage(key){

  });

  }

  location.hash=key;
  renderNav();
}
