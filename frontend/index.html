    "宁夏":["银川","石嘴山","吴忠","固原","中卫"],
    "新疆":["乌鲁木齐","克拉玛依","吐鲁番","哈密","阿克苏","喀什","和田","伊犁","塔城","阿勒泰"],
  };

  // 初始化所有标签选择器
  function initAllTagSelectors(){
    var fileTypeOptions=[
      {label:"暂定",value:"暂定"},
      {label:"国家法律",value:"国家法律"},
      {label:"行政法规",value:"行政法规"},
      {label:"地方法规",value:"地方法规"}
    ];
    var provinceOptions=Object.keys(provinceToCities).map(function(p){
      return {label:p,value:p};
    });

    // RAG 标签（可折叠）
    var ragProvinceEl=document.getElementById("ragProvinceTags");
    if(ragProvinceEl){
      window.__ragProvinces=[];
      createTagSelector(ragProvinceEl,provinceOptions,[],function(vals){
        window.__ragProvinces=vals;
        updateRagCityTags(vals);
      });
    }

    var ragCityEl=document.getElementById("ragCityTags");
    if(ragCityEl){
      window.__ragCities=[];
      window.__ragCityEl=ragCityEl;
    }

    var ragFileTypeEl=document.getElementById("ragFileTypeTags");
    if(ragFileTypeEl){
      window.__ragFileTypes=[];
      createTagSelector(ragFileTypeEl,fileTypeOptions,[],function(vals){
        window.__ragFileTypes=vals;
      });
    }
  }

  function getCityOptions(selectedProvinces){
    var citySet=new Set();
    selectedProvinces.forEach(function(p){
      var cities=provinceToCities[p]||[];
      cities.forEach(function(c){citySet.add(c);});
    });
    return Array.from(citySet).map(function(c){return {label:c,value:c};});
  }

  function updateRagCityTags(selectedProvinces){
    var el=window.__ragCityEl;
    if(!el) return;
    var cityOpts=getCityOptions(selectedProvinces);
    var curCities=window.__ragCities||[];
    var validCities=curCities.filter(function(c){
      return cityOpts.some(function(o){return o.value===c;});
    });
    window.__ragCities=validCities;
    // 直辖市自动选市：省选了北京、上海等，自动勾选对应城市
    var autoCities=selectedProvinces.filter(function(p){
      return cityOpts.some(function(o){return o.value===p;});
    });
    autoCities.forEach(function(c){
      if(validCities.indexOf(c)===-1) validCities.push(c);
    });
    window.__ragCities=validCities;
    createTagSelector(el,cityOpts,validCities,function(vals){
      window.__ragCities=vals;
    });
  }

  initAllTagSelectors();

  const ragToggle=document.getElementById("ragToggle");
  const ragEditBtn=document.getElementById("ragEditBtn");
  const ragSaveBtn=document.getElementById("ragSaveBtn");
  const ragTagsPanel=document.getElementById("ragTagsPanel");

  function updateRagUI(){
    // RAG 打开 → 显示编辑按钮
    if(ragEditBtn) ragEditBtn.style.display=enableRAG?"inline-block":"none";
  }

  if(ragToggle){
    ragToggle.checked=enableRAG;
    ragToggle.onchange=()=>{
      enableRAG=ragToggle.checked;
      updateRagUI();
      // RAG 勾选后自动展开标签面板
      if(enableRAG && ragTagsPanel) ragTagsPanel.style.display="flex";
    };
    updateRagUI();
  }

  // 编辑按钮：展开标签面板
  if(ragEditBtn && ragTagsPanel){
    ragEditBtn.onclick=()=>{
      if(ragTagsPanel) ragTagsPanel.style.display="flex";
    };
  }

  // 保存按钮：收起标签面板，保留选中值
  if(ragSaveBtn && ragTagsPanel){
    ragSaveBtn.onclick=()=>{
      if(ragTagsPanel) ragTagsPanel.style.display="none";
    };
  }

  // 初始状态：RAG 开启时默认展开标签面板，方便首次选择
  if(ragTagsPanel){
    ragTagsPanel.style.display=enableRAG?"flex":"none";
  }

  const clearButton=document.getElementById("clearChat");
  if(clearButton){
    clearButton.onclick=()=>{
      if(aiAbortController){
        aiCleared = true;
        aiAbortController.abort();
      }

      aiPartial = null;
      pendingImages=[];
      renderImagePreview();
      const continueBtn=document.getElementById("aiContinue");
      if(continueBtn) continueBtn.style.display="none";

      chatMessages=[
        {
          role:"system",
          content:`
          请严谨、客观地回答问题，避免虚构事实。
          `
        }
      ];

      saveChat();
      renderChat();
    };
  }

  const chatFileBtn=document.getElementById("chatFileBtn");
  if(chatFileBtn){
    const chatFileInput=document.createElement("input");
    chatFileInput.type="file";
    chatFileInput.accept=".txt,.docx,.pdf,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/pdf,image/*";
    chatFileInput.multiple=true;
    chatFileInput.style.display="none";
    chatFileBtn.parentNode.appendChild(chatFileInput);
    chatFileBtn.onclick=()=>{
      chatFileInput.value="";
      chatFileInput.click();
    };
    chatFileInput.onchange=async()=>{
      const files=Array.from(chatFileInput.files || []);
      if(files.length===0) return;

      const docFiles=[];
      const imgFiles=[];

      for(const file of files){
        if(file.type.startsWith("image/")){
          imgFiles.push(file);
        }else{
          docFiles.push(file);
        }
      }

      // 图片：转 base64 加入 pendingImages 并显示预览
      for(const file of imgFiles){
        const dataUrl=await new Promise((resolve,reject)=>{
          const r=new FileReader();
          r.onload=()=>resolve(r.result);
          r.onerror=reject;
          r.readAsDataURL(file);
        });
        pendingImages.push({dataUrl, name: file.name});
      }
      if(imgFiles.length>0){
        renderImagePreview();
      }

      // 文档：上传到知识库（默认暂定类型）
      if(docFiles.length>0){
        const fileType = "暂定";
        const invalidFiles=docFiles.filter(f=>!/\.(txt|docx|pdf)$/i.test(f.name));
        if(invalidFiles.length>0){
          alert("以下文档格式不支持："+invalidFiles.map(f=>f.name).join("、"));
          return;
        }
        for(const file of docFiles){
          const formData=new FormData();
          formData.append("file",file);
          formData.append("file_type",fileType);
          try{
            await fetch(API_BASE+"/files",{
              method:"POST",headers:{"Accept":"application/json"},body:formData
            });
          }catch(e){
            console.error("上传失败:",file.name,e);
          }
        }
        alert("文档上传完成，已添加到知识库");
      }
    };
  }

  const navToggle=document.getElementById("navToggle");
  if(navToggle){
    navToggle.onclick=toggleSidebar;
  }

  document.querySelectorAll(".module").forEach(module=>{
    module.onclick=()=>{
      showPage(module.dataset.key);
    };
  });

  loadDataCenterTasks();

}

const SIDEBAR_KEY="sidebar_collapsed";

function isSidebarCollapsed(){
  return document.body.classList.contains("side-collapsed");
}

function applySidebarState(collapsed){
  document.body.classList.toggle("side-collapsed", collapsed);
}

function toggleSidebar(){
  const collapsed=!isSidebarCollapsed();
  applySidebarState(collapsed);
  localStorage.setItem(SIDEBAR_KEY, collapsed ? "1" : "0");
}

function showPage(key){
  if(!modules[key]){
    key="ai";
  }

  current=key;

  document.querySelectorAll(".page").forEach(page=>{
    page.classList.remove("active");
  });

  const target=document.getElementById("page-"+key);

  if(target){
    target.classList.add("active");
  }

  location.hash=key;
  renderNav();

  if(key==="data"){
    startDataCenterPolling();
  }else if(dataCenterTimer){
    clearInterval(dataCenterTimer);
    dataCenterTimer=null;
  }

  if(key==="documents"){
    loadTaskTypes();
    loadDocuments();
  }

  if(key==="law"){
    showLawCategory(lawCategory);
  }

  if(key==="knowledge"){
    loadKnowledgeFiles();
  }
}

loadChat();
initPages();
applySidebarState(localStorage.getItem(SIDEBAR_KEY)==="1");
renderChat();
showPage(current);

// 回到最上方按钮
const backToTopBtn=document.getElementById("backToTop");
if(backToTopBtn){
  backToTopBtn.onclick=()=>{
    const main=document.getElementById("app");
    if(main) main.scrollIntoView({behavior:"smooth",block:"start"});
    document.querySelector(".layout")?.scrollIntoView({behavior:"smooth",block:"start"});
    window.scrollTo({top:0,behavior:"smooth"});
  };
}

// 监听到达顶部时自动隐藏按钮
const scrollContainer=document.querySelector(".layout") || window;
const scrollHandler=()=>{
  const scrollY=window.scrollY || document.documentElement.scrollTop;
  backToTopBtn?.classList.toggle("show",scrollY>300);
};
window.addEventListener("scroll",scrollHandler,{passive:true});
scrollHandler(); // 初始状态

// AI 状态轮询
async function fetchAiStatus(){
  const dot=document.getElementById("aiStatusDot");
  const text=document.getElementById("aiStatusText");
  if(!dot || !text) return;

  try{
    const res=await fetch(API_BASE+"/health");
    const health=await res.json();

    if(health.status!=="ok"){
      dot.className="ai-status-dot offline";
      text.textContent="服务异常";
      return;
    }
  }catch{
    dot.className="ai-status-dot offline";
    text.textContent="无法连接";
    return;
  }

  try{
    const res=await fetch(API_BASE+"/ai/status");
    const ai=await res.json();
    const busy=ai.qwen_busy || ai.qwen_chat_busy;
    const reachable=ai.qwen_reachable && ai.qwen_chat_reachable;

    if(reachable && !busy){
      dot.className="ai-status-dot online";
      text.textContent=ai.message || "AI 在线";
    }else if(reachable && busy){
      dot.className="ai-status-dot busy";
      text.textContent="AI 繁忙";
    }else{
      dot.className="ai-status-dot offline";
      text.textContent="AI 离线";
    }
  }catch{
    dot.className="ai-status-dot offline";
    text.textContent="AI 离线";
  }
}

fetchAiStatus();
setInterval(fetchAiStatus, 15000); // 每15秒刷新一次
</script>
