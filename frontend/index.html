<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>应急安全综合平台</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f5f7;color:#233746;font-family:Arial,"Microsoft YaHei",sans-serif}
header{position:fixed;left:0;top:0;width:100%;height:64px;background:#123b5d;color:white;padding:0 24px;display:flex;align-items:center;justify-content:space-between;z-index:30}
header strong{font-size:22px}
header span{font-size:13px}
.layout{display:block;min-height:calc(100vh - 64px);padding-top:64px}
aside{position:fixed;left:0;top:64px;bottom:0;width:210px;overflow-y:auto;background:white;border-right:1px solid #d9e2e8;padding:16px 10px;z-index:20}
aside button{width:100%;padding:13px;border:0;background:white;text-align:left;color:#405664;font-size:15px;cursor:pointer}
aside button.active{background:#e8f1f6;color:#123b5d;font-weight:bold;border-left:3px solid #c94135}
main{margin-left:210px;padding:28px;max-width:1400px;min-height:calc(100vh - 64px)}
.crumb{color:#6b7d89;font-size:13px;margin-bottom:12px}
h1{margin:0;color:#123b5d;font-size:26px}
.desc{color:#6b7d89;margin:8px 0 22px}
.panel{background:white;border:1px solid #d9e2e8;border-radius:5px;padding:20px;margin-top:18px}
.panel h2{font-size:17px;color:#123b5d;margin-top:0}
.status,.modules{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.status div,.module{border:1px solid #d9e2e8;background:white;border-radius:5px;padding:18px}
.status label{display:block;color:#6b7d89;font-size:13px;margin-bottom:8px}
.status b{color:#2f7452}
.btn-danger{padding:8px 14px;border:1px solid #c94135;background:#fff;color:#c94135;cursor:pointer;border-radius:4px}
.btn-danger:hover{background:#c94135;color:#fff}
.module{cursor:pointer}
.module:hover{border-color:#729bb1}
.module h2{margin:0 0 8px;color:#123b5d;font-size:17px}
.module p{margin:0;color:#6b7d89;line-height:1.6}
.empty{min-height:190px;border:1px dashed #c9d5dc;background:#fafcfd;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#6b7d89;text-align:center}
.empty strong{color:#435c6b;margin-bottom:8px}
textarea,input{width:100%;padding:11px;border:1px solid #cbd7de;border-radius:4px;font:inherit}
textarea{min-height:220px;resize:vertical;line-height:1.6}
.field{margin:14px 0}
.field label{display:block;font-size:14px;color:#536b78;margin-bottom:6px}
.btn{padding:10px 18px;border:0;border-radius:4px;background:#123b5d;color:white;cursor:pointer}
.btn:disabled{background:#9aaab3;cursor:not-allowed}
.result{white-space:pre-wrap;min-height:220px;padding:14px;background:#fafcfd;border:1px solid #d9e2e8;line-height:1.65;overflow:auto}
.note{color:#6b7d89;font-size:14px;line-height:1.6}
.success{color:#2f7452}
.error{color:#b6372e}
.download{display:inline-block;margin-top:12px;color:#155f8a}
.law-subnav{padding:0 0 8px 28px;background:#fff}
.law-subnav button{display:block;width:100%;padding:8px 10px;border:0;background:white;color:#6b7d89;text-align:left;font-size:13px;cursor:pointer}
.law-subnav button:hover{background:#f1f5f8;color:#123b5d}
.law-subnav button.law-subnav-active{background:#e8f1f6;color:#123b5d;font-weight:bold;border-left:3px solid #c94135}
.law-layout{display:grid;grid-template-columns:220px 1fr;gap:0;padding:0;overflow:hidden}
.law-menu{width:auto;padding:0;background:#fafafa;border:0;border-right:1px solid #d9e2e8}
.law-menu button{display:block;width:100%;padding:16px 20px;border:0;border-bottom:1px solid #d9e2e8;background:#fafafa;color:#405664;text-align:left;font-size:15px;cursor:pointer}
.law-menu button:hover,.law-menu-active{background:#3975b5!important;color:white!important}
.law-content{padding:20px 28px}
.law-content h2{margin-top:0;color:#123b5d;font-size:22px;border-bottom:1px solid #9fb4c2;padding-bottom:10px}
.law-list{min-height:300px}
@media(max-width:700px){.law-layout{grid-template-columns:1fr}.law-menu{border-right:0;border-bottom:1px solid #d9e2e8}.law-menu button{display:inline-block;width:auto;padding:12px 14px}.law-content{padding:16px}}

@media(max-width:700px){aside{width:150px}main{margin-left:150px;padding:16px}.status,.modules{grid-template-columns:1fr}.layout{min-height:calc(100vh - 64px)}}
@media(max-width:560px){header{padding:0 14px}header span{display:none}aside{width:58px;padding:10px 5px}aside button{font-size:0;text-align:center;padding:13px 0}aside button::first-letter{font-size:20px}main{padding:16px}.status,.modules{grid-template-columns:1fr}}

.panel-title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}

.btn-secondary{
  padding:8px 14px;
  border:1px solid #9fb4c2;
  background:#fff;
  color:#123b5d;
  cursor:pointer;
  border-radius:4px;
}

.kb-filter{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin:14px 0;
}

.kb-filter input,
.kb-filter select{
  width:auto;
  flex:1 1 150px;
  padding:9px 10px;
  border:1px solid #cbd7de;
  border-radius:4px;
  font:inherit;
}

.kb-filter button{
  flex:0 0 auto;
}

.data-task{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:16px 0;
  border-bottom:1px solid #d9e2e8;
}

.data-task-main{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.data-task-main strong{
  color:#123b5d;
  font-size:16px;
}

.data-task-main span{
  color:#6b7d89;
  font-size:13px;
}

.data-task-actions{
  display:flex;
  align-items:center;
  gap:12px;
  white-space:nowrap;
}

.task-status{
  color:#2f7452;
}

.status-failed{
  color:#b33a32;
}

.status-processing,
.status-pending{
  color:#9a6a12;
}

.data-task-detail{
  margin:0 0 16px;
  padding:16px 18px;
  background:#f7fafc;
  border-left:3px solid #3975b5;
  border-bottom:1px solid #d9e2e8;
}

.data-task-detail h2{
  font-size:15px;
  color:#123b5d;
  margin:0 0 12px;
}

.data-task-detail p{
  margin:6px 0;
  color:#405664;
}

.data-task-detail .result{
  min-height:120px;
}

@media(max-width:700px){
  .data-task{
    flex-direction:column;
  }

  .data-task-actions{
    justify-content:flex-start;
  }
}

.page {
  display: none;
}

.page.active {
  display: block;
}

</style>
</head>
<body>
<header>
<strong>应急安全综合平台</strong>
<span>内网设备：192.168.10.101</span>
</header>

<div class="layout">
<aside id="nav"></aside>
<main id="app">
  <section id="page-home" class="page"></section>
  <section id="page-law" class="page"></section>
  <section id="page-knowledge" class="page"></section>
  <section id="page-data" class="page"></section>
  <section id="page-documents" class="page"></section>
  <section id="page-ai" class="page"></section>
</main>
</div>

<script>
const modules={
home:{name:"综合首页",icon:"⌂",desc:"查看平台模块与本机运行信息"},
law:{name:"安全法律",icon:"法",desc:"查看安全生产、应急管理和消防相关法律法规"},
knowledge:{name:"知识库",icon:"库",desc:"管理知识库文件：上传、查看、删除与筛选"},
data:{name:"数据中心",icon:"数",desc:"查看文档处理任务及生成结果"},
documents:{name:"文档处理",icon:"文",desc:"粘贴文档并生成处理报告"},
ai:{name:"AI 对话",icon:"AI",desc:"与本地千问模型进行对话"}
};

const API_BASE="/api/v1";

let documentPollTimer=null;
let currentDocumentId=null;
const nav=document.getElementById("nav");
const app=document.getElementById("app");
const CHAT_STORAGE_KEY = "emergency_ai_chat_v1";
let current=location.hash.slice(1)||"home";
let lawCategory="national";
let documentState = {
  originalText: "",
  requirements: "",
  outputFilename: "处理结果.md",
  status: "",
  statusClass: "note",
  result: "",
  explanation: "",
  downloadUrl: "",
  processing: false,
  docId: null
};
let aiAbortController = null;
let chatMessages = [
  {
    role: "system",
    content: "请严谨回答，不得虚构事实。只能依据用户提供的信息回答；无法确认时明确说明。"
  }
];

function saveChat(){
  localStorage.setItem(
    CHAT_STORAGE_KEY,
    JSON.stringify(chatMessages)
  );
}

function loadChat(){
  try{
    const saved=JSON.parse(
      localStorage.getItem(CHAT_STORAGE_KEY)
    );

    if(Array.isArray(saved) && saved.length>0){
      chatMessages=saved;
    }
  }catch(error){
    console.warn("读取历史对话失败",error);
  }
}

function getChatHistory(){
  return chatMessages
    .filter(message=>message.role!=="system")
    .map(message=>{
      const name=message.role==="user"?"用户":"AI";
      return name+"："+message.content;
    })
    .join("\n\n");
}

function getRequestMessages(){
  const systemMessage=chatMessages.find(
    message=>message.role==="system"
  );

  const history=chatMessages
    .filter(message=>message.role!=="system")
    .slice(-20);

  return [systemMessage,...history];
}

function renderNav(){
  nav.innerHTML=Object.entries(modules).map(([key,item])=>{
    let html=`
      <button class="${current===key?"active":""}" data-key="${key}">
        ${item.icon}　${item.name}
      </button>
    `;

    if(key==="law"){
      const lawItems=[
        ["national","国家法律"],
        ["administrative","行政法规"],
        ["local","地方法规"]
      ];

      html+=`
        <div class="law-subnav">
          ${lawItems.map(([category,name])=>`
            <button
              class="${current==="law" && lawCategory===category
                ?"law-subnav-active"
                :""}"
              data-law-category="${category}"
            >
              ${name}
            </button>
          `).join("")}
        </div>
      `;
    }

    return html;
  }).join("");

  nav.querySelectorAll("button[data-key]").forEach(button=>{
    button.onclick=()=>{
      showPage(button.dataset.key);
    };
  });

  nav.querySelectorAll("button[data-law-category]").forEach(button=>{
    button.onclick=()=>{
      lawCategory=button.dataset.lawCategory;

      if(current!=="law"){
        showPage("law");
      }else{
        renderNav();
        showLawCategory(lawCategory);
      }
    };
  });
}

function emptyPage(key){
  const item=modules[key];
  return `
    <div class="crumb">当前位置 / ${item.name}</div>
    <h1>${item.name}</h1>
    <p class="desc">${item.desc}</p>
    <section class="panel">
      <h2>业务数据</h2>
      <div class="empty">
        <strong>暂无真实数据</strong>
        <span>后端接口和数据库接入后，此处显示实际业务记录。</span>
      </div>
    </section>
  `;
}

function dataCenterPage(){
  return `
    <div class="crumb">当前位置 / 数据中心</div>
    <h1>数据中心</h1>
    <p class="desc">查看文档处理任务及其生成结果。</p>

    <section class="panel">
      <div class="panel-title-row">
        <h2>历史任务</h2>
        <button id="dataRefreshBtn" class="btn-secondary">刷新</button>
      </div>

      <p id="dataStatus" class="note">正在加载任务...</p>
      <div id="dataTaskList"></div>
    </section>
  `;
}


function home(){
  const cards=Object.entries(modules)
    .filter(([key])=>key!=="home")
    .map(([key,item])=>
      `<div class="module" data-key="${key}">
        <h2>${item.name}</h2>
        <p>${item.desc}</p>
      </div>`
    ).join("");

  return `
    <div class="crumb">当前位置 / 综合首页</div>
    <h1>平台首页</h1>
    <p class="desc">本页面不展示演示数据，只显示已确认的系统信息和功能入口。</p>

    <div class="status">
      <div><label>设备地址</label><b>192.168.10.101</b></div>
      <div><label>访问方式</label><b>内网 HTTP</b></div>
      <div><label>数据状态</label><b>等待后端接入</b></div>
    </div>

    <section class="panel">
      <h2>功能模块</h2>
      <div class="modules">${cards}</div>
    </section>
  `;
}

async function loadTaskTypes(){
  const select=document.getElementById("taskType");
  const description=document.getElementById("taskDescription");

  try{
    const response=await fetch(API_BASE+"/tasks");
    const result=await response.json();

    if(!response.ok){
      throw new Error(result.message || "任务类型加载失败");
    }

    const tasks=Array.isArray(result.tasks) ? result.tasks : [];

    if(tasks.length===0){
      select.innerHTML='<option value="">暂无任务类型</option>';
      return;
    }

    select.innerHTML=tasks.map(task=>`
      <option value="${escapeHtml(task.key)}">
        ${escapeHtml(task.name)}
      </option>
    `).join("");

    function updateDescription(){
      const selected=tasks.find(task=>task.key===select.value);
      description.textContent=selected ? selected.description || "" : "";
    }

    select.onchange=updateDescription;
    updateDescription();
  }catch(error){
    select.innerHTML='<option value="">加载失败</option>';
    description.textContent=error.message;
  }
}

function lawPage(){
  return `
    <div class="crumb">当前位置 / 安全法律</div>
    <h1>安全法律</h1>
    <p class="desc">查看安全生产、应急管理和消防减灾相关法律法规。</p>

    <section class="panel">
      <h2 id="lawTitle">国家法律</h2>
      <div id="lawList" class="law-list">
        <div class="empty">
          <strong>暂无真实法律法规数据</strong>
          <span>接入法律法规接口后，此处显示实际内容。</span>
        </div>
      </div>
    </section>
  `;
}

function knowledgePage(){
  return `
    <div class="crumb">当前位置 / 知识库</div>
    <h1>知识库</h1>
    <p class="desc">管理知识库文件：上传、查看、删除与筛选。</p>

    <section class="panel">
      <div class="panel-title-row">
        <h2>知识库文件管理</h2>
        <button id="kbRefreshBtn" class="btn-secondary">刷新</button>
      </div>

      <div class="field">
        <label for="kbFileInput">上传 txt 文件（可多选）</label>
        <input id="kbFileInput" type="file" accept=".txt,text/plain" multiple>
      </div>

      <div class="field">
        <label for="kbFileTypeInput">文件类型</label>
        <select id="kbFileTypeInput">
          <option value="">请选择类型（可选）</option>
          <option value="国家法律">国家法律</option>
          <option value="行政法规">行政法规</option>
          <option value="地方法规">地方法规</option>
        </select>
      </div>

      <button id="kbUploadBtn" class="btn">上传并建立索引</button>
      <p id="kbStatus" class="note"></p>

      <div class="kb-filter">
        <input id="kbKeywordInput" type="text" placeholder="按文件名关键字搜索">
        <select id="kbTypeFilterInput">
          <option value="">全部类型</option>
          <option value="国家法律">国家法律</option>
          <option value="行政法规">行政法规</option>
          <option value="地方法规">地方法规</option>
        </select>
        <select id="kbStatusFilter">
          <option value="">全部状态</option>
          <option value="building">建立中</option>
          <option value="ready">就绪</option>
          <option value="failed">失败</option>
        </select>
        <button id="kbSearchBtn" class="btn-secondary">查询</button>
      </div>

      <div id="kbFileList"></div>
    </section>
  `;
}

function showLawCategory(category){
  const titles={
    national:"国家法律",
    administrative:"行政法规",
    local:"地方法规"
  };

  const title=document.getElementById("lawTitle");
  const list=document.getElementById("lawList");

  if(!title || !list){
    return;
  }

  title.textContent=titles[category] || "安全法律";

  list.innerHTML=`
    <div class="empty">
      <strong>暂无真实法律法规数据</strong>
      <span>当前分类尚未接入真实数据接口。</span>
    </div>
  `;
}

function formatFileSize(bytes){
  const size=Number(bytes)||0;

  if(size>=1048576){
    return (size/1048576).toFixed(2)+" MB";
  }

  if(size>=1024){
    return (size/1024).toFixed(1)+" KB";
  }

  return size+" B";
}

function knowledgeFileStatus(status){
  return {
    building:"建立中",
    ready:"就绪",
    failed:"失败"
  }[status] || status || "未知";
}

async function loadKnowledgeFiles(){
  const list=document.getElementById("kbFileList");
  const status=document.getElementById("kbStatus");

  if(!list || !status){
    return;
  }

  const keywordInput=document.getElementById("kbKeywordInput");
  const typeInput=document.getElementById("kbTypeFilterInput");
  const statusInput=document.getElementById("kbStatusFilter");

  const keyword=keywordInput ? keywordInput.value.trim() : "";
  const fileType=typeInput ? typeInput.value.trim() : "";
  const statusValue=statusInput ? statusInput.value : "";

  const params=new URLSearchParams();

  if(keyword){
    params.set("keyword",keyword);
  }

  if(fileType){
    params.set("file_type",fileType);
  }

  if(statusValue){
    params.set("status",statusValue);
  }

  const query=params.toString();
  const url=API_BASE+"/files"+(query ? "?"+query : "");

  status.textContent="正在加载文件...";
  status.className="note";

  try{
    const response=await fetch(url,{
      headers:{"Accept":"application/json"},
      cache:"no-store"
    });

    const result=await readJsonResponse(response);

    if(!response.ok){
      throw new Error(getErrorMessage(result));
    }

    const files=Array.isArray(result) ? result : [];

    if(files.length===0){
      list.innerHTML=`
        <div class="empty">
          <strong>知识库暂无文件</strong>
          <span>上传 txt 文件后，此处会显示登记与索引状态。</span>
        </div>
      `;
      status.textContent="";
      return;
    }

    list.innerHTML=files.map(file=>`
      <div class="data-task">
        <div class="data-task-main">
          <strong>${escapeHtml(file.filename || "未命名文件")}</strong>
          <span>类型：${escapeHtml(file.file_type || "—")}</span>
          <span>大小：${escapeHtml(formatFileSize(file.size))}</span>
          <span>分块数：${escapeHtml(file.chunk_count ?? 0)}</span>
          <span>更新时间：${escapeHtml(formatTime(file.updated_at) || "—")}</span>
          ${
            file.message
              ? `<span>备注：${escapeHtml(file.message)}</span>`
              : ""
          }
        </div>

        <div class="data-task-actions">
          <b class="task-status status-${escapeHtml(file.status || "")}">
            ${escapeHtml(knowledgeFileStatus(file.status))}
          </b>
          <button
            class="btn-secondary"
            data-kb-view="${escapeHtml(file.filename || "")}"
          >
            查看
          </button>
          <button
            class="btn-danger"
            data-kb-delete="${escapeHtml(file.filename || "")}"
          >
            删除
          </button>
        </div>
      </div>
    `).join("");

    list.querySelectorAll("[data-kb-view]").forEach(button=>{
      button.onclick=()=>{
        viewKnowledgeFile(button.dataset.kbView, button);
      };
    });

    list.querySelectorAll("[data-kb-delete]").forEach(button=>{
      button.onclick=()=>{
        deleteKnowledgeFile(button.dataset.kbDelete, button);
      };
    });

    status.textContent=`共 ${files.length} 个文件`;
    status.className="note success";
  }catch(error){
    list.innerHTML="";
    status.textContent="文件列表加载失败："+error.message;
    status.className="note error";
  }
}

function resetKnowledgeFilters(){
  const keyword=document.getElementById("kbKeywordInput");
  const type=document.getElementById("kbTypeFilterInput");
  const status=document.getElementById("kbStatusFilter");

  if(keyword){
    keyword.value="";
  }

  if(type){
    type.value="";
  }

  if(status){
    status.value="";
  }

  loadKnowledgeFiles();
}

async function readJsonResponse(response){
  const text=await response.text();

  if(!text){
    return {};
  }

  try{
    return JSON.parse(text);
  }catch(error){
    return {
      message:"接口返回了非 JSON 内容，HTTP "+response.status
    };
  }
}

async function uploadKnowledgeFile(){
  const input=document.getElementById("kbFileInput");
  const status=document.getElementById("kbStatus");
  const button=document.getElementById("kbUploadBtn");
  const fileTypeInput=document.getElementById("kbFileTypeInput");

  if(!input || !status || !button){
    return;
  }

  const files=Array.from(input.files || []);

  if(files.length===0){
    status.textContent="请先选择要上传的 txt 文件";
    status.className="note error";
    return;
  }

  const invalidFiles=files.filter(
    file=>!/\.txt$/i.test(file.name)
  );

  if(invalidFiles.length>0){
    status.textContent=
      "以下文件不是 txt 格式："+invalidFiles
        .map(file=>file.name)
        .join("、");
    status.className="note error";
    return;
  }

  button.disabled=true;
  button.textContent="正在上传...";

  const fileType=fileTypeInput ? fileTypeInput.value.trim() : "";

  let successCount=0;
  const failedFiles=[];

  try{
    for(let index=0;index<files.length;index++){
      const file=files[index];

      status.textContent=
        `正在上传 ${index+1}/${files.length}：${file.name}`;
      status.className="note";

      const formData=new FormData();
      formData.append("file",file);

      if(fileType){
        formData.append("file_type",fileType);
      }

      try{
        const response=await fetch(API_BASE+"/files",{
          method:"POST",
          headers:{"Accept":"application/json"},
          body:formData
        });

        const result=await readJsonResponse(response);

        if(!response.ok){
          throw new Error(getErrorMessage(result));
        }

        successCount++;
      }catch(error){
        failedFiles.push({
          name:file.name,
          message:error.message
        });
      }
    }

    input.value="";

    if(failedFiles.length===0){
      status.textContent=
        `上传完成，共成功上传 ${successCount} 个文件`;
      status.className="note success";
    }else{
      status.textContent=
        `上传完成：成功 ${successCount} 个，失败 `+
        `${failedFiles.length} 个。失败文件：`+
        failedFiles.map(item=>
          `${item.name}（${item.message}）`
        ).join("；");
      status.className="note error";
    }

    await loadKnowledgeFiles();
  }finally{
    button.disabled=false;
    button.textContent="上传并建立索引";
  }
}

async function sendAiMessage(){
  aiAbortController = new AbortController();
  const stopButton = document.getElementById("aiStop");
  stopButton.disabled = false;
  const input=document.getElementById("aiInput");
  const log=document.getElementById("chatLog");
  const status=document.getElementById("aiStatus");
  const button=document.getElementById("aiSend");
  const content=input.value.trim();

  if(!content){
    status.textContent="请输入问题";
    status.className="note error";
    return;
  }

  button.disabled=true;
  button.textContent="处理中...";
  status.textContent="正在处理...";
  status.className="note";

  chatMessages.push({
    role:"user",
    content:content
  });

  saveChat();

  log.textContent=getChatHistory()+"\n\nAI：";
  log.scrollTop=log.scrollHeight;

  let fullAnswer="";
  let buffer="";

  try{
    const response=await fetch(
      "/v1/chat/completions",
      {
        method:"POST",
        headers:{
          "Accept":"text/event-stream",
          "Content-Type":"application/json"
        },
        signal: aiAbortController.signal,
        body:JSON.stringify({
          model:"tpu-qwen3.5",
          messages:getRequestMessages(),
          stream:true,
          temperature:0.7,
          max_tokens:2048
        })
      }
    );

    if(!response.ok){
      const errorText=await response.text();
      throw new Error(
        errorText || "AI 接口请求失败"
      );
    }

    if(!response.body){
      throw new Error(
        "浏览器不支持流式响应"
      );
    }

    const reader=response.body.getReader();
    const decoder=new TextDecoder("utf-8");

    function handleLine(rawLine){
      const line=rawLine.trim();

      if(!line || !line.startsWith("data:")){
        return;
      }

      const data=line.slice(5).trim();

      if(!data || data==="[DONE]"){
        return;
      }

      try{
        const chunk=JSON.parse(data);
        const text=
          chunk.choices &&
          chunk.choices[0] &&
          chunk.choices[0].delta &&
          chunk.choices[0].delta.content;

        if(text){
          fullAnswer+=text;
          log.textContent+=text;
          log.scrollTop=log.scrollHeight;
        }
      }catch(error){
        console.warn(
          "忽略无法解析的数据块：",
          data
        );
      }
    }

    while(true){
      const {value,done}=await reader.read();

      if(done){
        break;
      }

      buffer+=decoder.decode(
        value,
        {stream:true}
      );

      const lines=buffer.split(/\r?\n/);
      buffer=lines.pop() || "";

      for(const line of lines){
        handleLine(line);
      }
    }

    if(buffer.trim()){
      handleLine(buffer);
    }

    chatMessages.push({
      role:"assistant",
      content:fullAnswer
    });

    saveChat();

    input.value="";
    status.textContent="处理完成";
    status.className="note success";

  }catch(error){
    if(error.name === "AbortError"){
    status.textContent = "已停止生成";
    status.className = "note";
    }else{
    status.textContent = "请求失败：" + error.message;
    status.className = "note error";
    }
  }finally{
    button.disabled=false;
    button.textContent="发送";
    stopButton.disabled = true;
    aiAbortController = null;
  }
}

async function processDocument(){
  const taskType=document.getElementById("taskType").value;
  const originalText=document.getElementById("documentContent").value.trim();
  const requirements=document.getElementById("instruction").value.trim();
  const outputFilename=document.getElementById("fileName").value.trim();

  const button=document.getElementById("processBtn");
  const status=document.getElementById("documentStatus");
  const resultBox=document.getElementById("resultContent");
  const downloadLink=document.getElementById("downloadLink");

  if(!taskType || !originalText || !requirements || !outputFilename){
    status.textContent="请完整填写任务类型、原始文档、处理要求和文件名";
    status.className="note error";
    return;
  }

  button.disabled=true;
  button.textContent="正在提交...";
  status.textContent="正在提交任务";
  status.className="note";
  resultBox.textContent="任务提交中...";
  downloadLink.hidden=true;

  try{
    const response=await fetch(API_BASE+"/documents/process",{
      method:"POST",
      headers:{
        "Accept":"application/json",
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        task_type:taskType,
        original_text:originalText,
        requirements:requirements,
        output_filename:outputFilename
      })
    });

    const result=await response.json();

    if(!response.ok){
      throw new Error(getErrorMessage(result));
    }

    if(!result.id){
      throw new Error("后端没有返回任务 ID");
    }

    currentDocumentId=result.id;
    status.textContent=result.message || "任务已提交";
    resultBox.textContent="AI 正在处理，请等待...";

    startDocumentPolling(result.id);
    loadDocuments();
  }catch(error){
    status.textContent=error.message;
    status.className="note error";
    resultBox.textContent="提交失败";
    button.disabled=false;
    button.textContent="开始处理";
  }
}

function startDocumentPolling(id){
  if(documentPollTimer){
    clearInterval(documentPollTimer);
  }

  checkDocumentStatus(id);

  documentPollTimer=setInterval(()=>{
    checkDocumentStatus(id);
  },3000);
}

async function checkDocumentStatus(id){
  const status=document.getElementById("documentStatus");
  const resultBox=document.getElementById("resultContent");
  const button=document.getElementById("processBtn");
  const downloadLink=document.getElementById("downloadLink");

  try{
    const response=await fetch(
      API_BASE+"/documents/"+encodeURIComponent(id)
    );

    const result=await response.json();

    if(!response.ok){
      throw new Error(getErrorMessage(result));
    }

    if(result.status==="completed"){
      clearInterval(documentPollTimer);
      documentPollTimer=null;

      status.textContent="处理完成";
      status.className="note success";
      resultBox.textContent=result.report_content || "后端未返回报告内容";

      downloadLink.href=
        API_BASE+"/documents/"+encodeURIComponent(id)+"/download";
      downloadLink.download=result.output_filename || "分析报告";
      downloadLink.hidden=false;

      button.disabled=false;
      button.textContent="开始处理";
      loadDocuments();
      return;
    }

    if(result.status==="failed"){
      clearInterval(documentPollTimer);
      documentPollTimer=null;

      status.textContent="处理失败";
      status.className="note error";
      resultBox.textContent=result.report_content || "后端未返回失败原因";

      button.disabled=false;
      button.textContent="重新提交";
      loadDocuments();
      return;
    }

    status.textContent=result.status==="pending"
      ? "任务排队中"
      : "AI 正在处理";
  }catch(error){
    clearInterval(documentPollTimer);
    documentPollTimer=null;

    status.textContent="查询失败："+error.message;
    status.className="note error";
    button.disabled=false;
    button.textContent="重新提交";
  }
}

    ? value
    : date.toLocaleString("zh-CN");
}

  document.getElementById("dataRefreshBtn");

if(dataRefreshButton){
  dataRefreshButton.onclick=loadDataCenterTasks;
}

  const processButton=document.getElementById("processBtn");
if(processButton){
  processButton.onclick=processDocument;
}

const refreshDocumentsButton=
  document.getElementById("refreshDocuments");

if(refreshDocumentsButton){
  refreshDocumentsButton.onclick=loadDocuments;
}

const kbRefreshButton=document.getElementById("kbRefreshBtn");
if(kbRefreshButton){
  kbRefreshButton.onclick=resetKnowledgeFilters;
}

const kbUploadButton=document.getElementById("kbUploadBtn");
if(kbUploadButton){
  kbUploadButton.onclick=uploadKnowledgeFile;
}

const kbSearchButton=document.getElementById("kbSearchBtn");
if(kbSearchButton){
  kbSearchButton.onclick=loadKnowledgeFiles;
}

loadTaskTypes();
loadDocuments();

  const sendButton=document.getElementById("aiSend");
  if(sendButton){
    sendButton.onclick=sendAiMessage;
  }

  const stopButton=document.getElementById("aiStop");
  if(stopButton){
    stopButton.onclick=()=>{
      if(aiAbortController){
        aiAbortController.abort();
      }
    };
  }

  const aiInput=document.getElementById("aiInput");
  if(aiInput){
    aiInput.addEventListener("keydown",event=>{
      if(event.key==="Enter" && !event.shiftKey){
        event.preventDefault();

        if(sendButton && !sendButton.disabled){
          sendAiMessage();
        }
      }
    });
  }

  const clearButton=document.getElementById("clearChat");
  if(clearButton){
    clearButton.onclick=()=>{
      if(aiAbortController){
        aiAbortController.abort();
      }

      chatMessages=[
        {
          role:"system",
          content:`
          真实回答，不得虚构
          `
        }
      ];

      saveChat();

      const chatLog=document.getElementById("chatLog");
      if(chatLog){
        chatLog.textContent="暂无对话";
      }
    };
  }

  document.querySelectorAll(".module").forEach(module=>{
    module.onclick=()=>{
      showPage(module.dataset.key);
    };
  });

  loadDataCenterTasks();

}

function showPage(key){
  if(!modules[key]){
    key="home";
  }

  current=key;

  document.querySelectorAll(".page").forEach(page=>{
    page.classList.remove("active");
  });

  const target=document.getElementById("page-"+key);

  if(target){
    target.classList.add("active");
  }

  location.hash=key;
  renderNav();

  if(key==="data"){
    loadDataCenterTasks();
  }

  if(key==="documents"){
    loadTaskTypes();
    loadDocuments();
  }

  if(key==="law"){
    showLawCategory(lawCategory);
  }

  if(key==="knowledge"){
    loadKnowledgeFiles();
  }
}

loadChat();
initPages();
showPage(current);
</script>
</body>
</html>
